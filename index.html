<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>QuickNotes</title>
  <meta name="description" content="Quick notes and to-do lists synced through Google Drive">
  <meta name="theme-color" content="#b45309">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icons/icon.svg" alt="" width="28" height="28">
      <span class="brand-name">QuickNotes</span>
      <span id="version" class="version"></span>
    </div>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <button id="signin-btn" class="btn primary" type="button" hidden>Sign in</button>
  </header>

  <main class="main">
    <div id="actions" class="actions" hidden>
      <input id="search" type="search" placeholder="Search notes…" autocomplete="off"
             spellcheck="false" aria-label="Search notes">
      <button id="new-note" class="btn primary" type="button" title="New note (N)">+ Note</button>
      <button id="new-list" class="btn primary" type="button" title="New list (L)">+ List</button>
    </div>

    <section id="pinned-sec" class="sec" hidden>
      <h2 class="sec-head">Pinned</h2>
      <div id="pinned" class="grid"></div>
    </section>
    <section class="sec">
      <h2 id="others-head" class="sec-head" hidden>Others</h2>
      <div id="others" class="grid"></div>
    </section>
    <div id="empty" class="empty" hidden></div>
  </main>

  <dialog id="editor" class="editor" aria-label="Edit note" tabindex="-1" autofocus>
    <div class="ed-scroll">
      <input id="ed-title" class="ed-title" type="text" placeholder="Title" autocomplete="off" aria-label="Title">
      <textarea id="ed-text" class="ed-text" placeholder="Note" aria-label="Note text"></textarea>
      <div id="ed-items" class="ed-items"></div>
    </div>
    <div id="palette" class="palette" role="group" aria-label="Background color" hidden></div>
    <div class="ed-bar">
      <button id="ed-color" class="icon-btn" type="button" title="Background color" aria-label="Background color"
              aria-expanded="false" aria-controls="palette">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0 0 18c1.1 0 1.8-.8 1.8-1.7 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-.9.8-1.7 1.8-1.7H16.7A4.3 4.3 0 0 0 21 11c0-4.4-4-8-9-8z"/><circle cx="7.5" cy="11.5" r="1.4"/><circle cx="10.5" cy="7.5" r="1.4"/><circle cx="15" cy="7.5" r="1.4"/></svg>
      </button>
      <button id="ed-pin" class="icon-btn" type="button" title="Pin" aria-label="Pin" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l-1 6 4 4v2h-5v6l-1 1-1-1v-6H6v-2l4-4z"/></svg>
      </button>
      <button id="ed-convert" class="icon-btn" type="button" title="Convert to list" aria-label="Convert to list">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="5" height="5" rx="1"/><path d="M11 6.5h10"/><rect x="3" y="14" width="5" height="5" rx="1"/><path d="M11 16.5h10"/></svg>
      </button>
      <button id="ed-copy" class="icon-btn" type="button" title="Copy to clipboard" aria-label="Copy to clipboard">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h2"/></svg>
      </button>
      <button id="ed-delete" class="icon-btn" type="button" title="Delete note" aria-label="Delete note">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13M9 7V4h6v3"/></svg>
      </button>
      <span id="ed-time" class="ed-time"></span>
      <button id="ed-done" class="btn" type="button">Done</button>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" popover="manual">
    <span id="toast-msg"></span>
    <button id="toast-btn" class="toast-btn" type="button" hidden></button>
  </div>

  <script src="version.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
